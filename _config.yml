# Site settings. All page copy lives in the Markdown files, not here.
title: Jesper Rasmussen
tagline: Senior Game Programmer
description: Jesper Rasmussen is a senior game programmer with more than 20 years of professional experience.
url: https://repsej.github.io
baseurl: ""
lang: en

author:
  name: Jesper Rasmussen

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/
  experience:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - README.md
  - PLAN.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - .ruby-version
