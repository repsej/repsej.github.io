{%- assign shots = page.screenshots -%}
<ul class="gallery">
{%- for shot in shots %}
{%- assign extension = shot.file | split: "." | last | downcase %}
<li{% unless forloop.first %} hidden{% endunless %}><a class="gallery-item{% if extension == 'gif' and shot.thumb %} is-animated{% endif %}" href="{{ shot.file | relative_url }}"><img src="{{ shot.thumb | default: shot.file | relative_url }}" alt="{{ shot.alt | escape }}" loading="lazy">{% if forloop.first and shots.size > 1 %}<span class="gallery-count">{{ shots.size }} images</span>{% endif %}</a></li>
{%- endfor %}
</ul>
<dialog class="viewer" aria-label="Screenshots">
<img class="viewer-image" alt="">
<p class="viewer-loading">Loading…</p>
<p class="viewer-count" aria-live="polite"></p>
<button class="viewer-button viewer-close" type="button" aria-label="Close">&times;</button>
<button class="viewer-button viewer-prev" type="button" aria-label="Previous screenshot">&larr;</button>
<button class="viewer-button viewer-next" type="button" aria-label="Next screenshot">&rarr;</button>
</dialog>
<script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>
