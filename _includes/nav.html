{% assign nav_pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
<header class="site-header">
<div class="wrap site-header-inner">
<a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
<p class="print-only print-tagline">{{ site.tagline }} / {{ site.url | remove: "https://" }}</p>
<nav aria-label="Main">
<ul>
{% for p in nav_pages %}
<li><a href="{{ p.url | relative_url }}"{% if page.url contains p.url %} aria-current="page"{% endif %}>{{ p.nav_title | default: p.title }}</a></li>
{% endfor %}
</ul>
</nav>
</div>
</header>
