<dialog class="viewer" aria-label="Image viewer">
<img class="viewer-image" alt="">
<p class="viewer-loading">Loading…</p>
<p class="viewer-count" aria-live="polite"></p>
<button class="viewer-button viewer-close" type="button" aria-label="Close">&times;</button>
<button class="viewer-button viewer-prev" type="button" aria-label="Previous image">&larr;</button>
<button class="viewer-button viewer-next" type="button" aria-label="Next image">&rarr;</button>
</dialog>
<script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>
